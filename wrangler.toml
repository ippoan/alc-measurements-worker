# 測定の Worker (Refs ippoan/alc-app#436、ippoan/rust-alc-api#697)。rust-alc-api の crates/alc-misc の
# 測定の口 (`/api/measurements`) を移す先。型は ippoan/alc-trouble-worker と同じ。
#
# ★ この Worker は呼び手を認証しない (auth-worker が付けた X-Tenant-ID を信頼する)。
#   本番・staging とも、到達経路は auth-worker からの Service Binding だけにする:
#   - workers_dev = false / preview_urls = false (*.workers.dev と preview URL を開けない)
#   - route / routes / custom_domain を書かない
#   どの env も workers_dev / preview_urls を false にする (ohishi-exp/rust-leave-worker#3 の決定と同じ)。
#   scripts/check-exposure.sh が CI で毎回これを検査する。
# ★ 表の順を変えない・前の方に表を足さない (scripts/check-exposure-test.sh の陰性対照は、特定の表の
#   直前に行を挿して崩す作り。CLAUDE.md)。新しい表は placement の表より後に置く。
name = "alc-measurements"
main = "build/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[build]
command = "cargo install -q worker-build@0.8.7 && worker-build --release"

# 応答ヘッダー x-worker-version / x-worker-tag の元 (src/lib.rs)。binding は env に継承されないので
# トップレベルと env.staging の両方に要る。tag / message は deploy の --tag / --message (deploy.yml)
[version_metadata]
binding = "CF_VERSION_METADATA"

# 本番の DB は aws:ap-northeast-1。Worker をその近くで動かす
[placement]
region = "aws:ap-northeast-1"

# 本番でもログを残す (env に継承されないので、staging は下で別に書く)。口が出すログは段の名前・kind だけ
[observability]
enabled = true

# 本番の DB: Cloudflare Hyperdrive の binding MEASUREMENTS_HYPERDRIVE (src/db.rs)。設定は実行用ロールのもの 1 つを
# 複数の worker で共有する (worker ごとに作らない。id は ippoan/alc-trouble-worker と同じ)。
# 接続先・資格情報・TLS は設定の側に在り、ここに書くのは設定の ID だけ。
# env.staging / env.local には置かない (binding は env に継承されない。scripts/check-exposure.sh が検査する)。
[[hyperdrive]]
binding = "MEASUREMENTS_HYPERDRIVE"
id = "6bdf446634034f989d4e094d5510b162"

# 顔写真・動画の R2 (rust-alc-api の本番の bucket と同じで、既存の写真・動画をそのまま読む。読むだけ。src/r2.rs)。
# binding は env に継承されないので、staging は下で別の bucket を指す
[[r2_buckets]]
binding = "MEASUREMENTS_R2"
bucket_name = "alc-face-photos"

# アルコール検知メール (Refs ippoan/alc-app#436): 測定のアルコール値が 0 より上になったら、テナントの notify のグループ
# 「アルコール検知」のメンバーへ 1 人 1 通送る (crates/measurements/src/alert.rs、binding の包みは src/mail.rs)。
# 送れるのは Cloudflare アカウントで確認済みの送り先だけ。**destination_address は書かない** (書くと 1 人にしか送れない)。
# binding は env に継承されないので、staging は下で別に書く
[[send_email]]
name = "ALERT_EMAIL"

# 差出人 (送信ドメインは Cloudflare の Email Sending で確認済みのもの)。env に継承されないので staging は下で別に書く
[vars]
NOTIFY_EMAIL_FROM = "alc-alert@mtamaramu.com"

# staging: DB は ippoan/alc-vein-worker の staging と同じもの (Workers VPC の binding MEASUREMENTS_DB_VPC から
# 既存の Tunnel 経由で PgBouncer へ繋ぐ。src/db.rs)。Hyperdrive は通さない。
[env.staging]
name = "alc-measurements-staging"
workers_dev = false
preview_urls = false

[env.staging.observability]
enabled = true

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

# Worker の実行場所を staging の DB の近くに寄せる (ippoan/alc-vein-worker の staging と同じ region)
[env.staging.placement]
region = "aws:ap-northeast-3"

# staging の DB への口 (vein / lineworks / trouble の staging と同じ VPC Service を共有)。本番 (トップレベル) には置かない
# (scripts/check-exposure.sh が検査)
[[env.staging.vpc_services]]
binding = "MEASUREMENTS_DB_VPC"
# service_id は VPC Service の参照 (宛先の Tunnel・host:port は Service 側に閉じる)
service_id = "01a0efa3-57ee-7631-912e-7f261d828127"
remote = true

# staging の R2 は staging 用の bucket (本番の bucket を指すと本番の写真・動画を読む。scripts/check-exposure.sh が検査)
[[env.staging.r2_buckets]]
binding = "MEASUREMENTS_R2"
bucket_name = "alc-face-photos-staging"

# アルコール検知メール。トップレベルと同じ binding と差出人 (destination_address は書かない)
[[env.staging.send_email]]
name = "ALERT_EMAIL"

[env.staging.vars]
NOTIFY_EMAIL_FROM = "alc-alert@mtamaramu.com"

# ローカル (`wrangler dev --env local`) 専用。deploy しない。
# binding を持たない (binding は env に継承されない) ので、src/db.rs は文字列 DATABASE_URL の段で繋ぐ
[env.local]
name = "alc-measurements-local"
workers_dev = false
preview_urls = false
