[package]
name = "measurements"
version = "0.1.0"
edition = "2021"
publish = false

# 口 (`router`)・入力の検証・SQL を持ち、native でも wasm32-unknown-unknown でもビルドできる
# (接続は持たない。張るのは直下の worker と tests/)。
[dependencies]
# 出どころは直下の Cargo.toml の [workspace.dependencies] の 1 か所 (ここに git / path を書かない)
alc-core-wasm = { workspace = true }
alc-worker-db = { workspace = true }
# multipart は upload の 3 口 (rust と同じ axum の Multipart。multer は pure Rust で wasm32 でもビルドできる)
axum = { version = "0.8", default-features = false, features = ["json", "multipart", "query"] }
# 行の時刻 (rust-alc-api と同じ chrono の JSON の形)。NaiveDate は車検期限 (carins_expires_on)
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
# 段の口の SQL を定数で組む (ippoan/alc-tenko-worker の sessions.rs から移したもの)
const_format = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# 点呼記録の record_data。preserve_order を付けない (rust と同じく key の昇順で並ぶ = record_hash が同じになる)
serde_json = "1"
# 点呼記録の record_hash (rust の record_payload と同じ SHA-256)。pure Rust
sha2 = "0.10"
# 型付きの文の型 (`Type`) と列の型 (uuid・timestamptz・date・jsonb)。接続は張らない
# (wasm 用の feature `js` は直下の worker と alc-worker-db が付ける)
tokio-postgres = { version = "0.7", default-features = false, features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
# tests/ の実 DB の接続 (runtime 付き)。dev-dependency なので wasm のビルドには入らない
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
