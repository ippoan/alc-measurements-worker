# 行カバレッジ 100% の登録簿 (ippoan/alc-trouble-worker の同名のファイルの形。Refs ippoan/alc-app#436)。
#
#   bash scripts/fetch-migrations.sh
#   MEASUREMENTS_TEST_ADMIN_DATABASE_URL=... cargo llvm-cov --locked -p measurements --text > cov-measurements.txt
#   bash scripts/check_coverage_100.sh --use-cache cov-measurements.txt
#
# 計測するのは `cargo test -p measurements` の全部 = 各 module の単体テスト (純粋関数) と tests/api_db.rs・files_db.rs・normal_tenko_db.rs・alert_db.rs・deferred_tenko_db.rs・bp_db.rs・report_db.rs・bp_settings_db.rs
# (口から実 DB まで。接続先が無ければ失敗する)。
# worker 本体 (直下の src/、wasm 専用) は native で計測できないので対象外。

# tenant の layer・DB の失敗の語・dev端末の印・router の組み立て
[[files]]
path = "crates/measurements/src/lib.rs"

# 5 口 (検証の 400・404・一覧の動的 WHERE とページ・DB の失敗)
[[files]]
path = "crates/measurements/src/measurements.rs"

# 顔写真・動画の 2 口 (404・キーの取り出し・R2 の失敗・DB の失敗・binding 無しの 503)
[[files]]
path = "crates/measurements/src/files.rs"

# 行の読み取り (Measurement の 19 列)
[[files]]
path = "crates/measurements/src/models.rs"

# 通常点呼の記録 (SAVEPOINT・冪等・既存の session の id・記録の失敗で測定を残す)
[[files]]
path = "crates/measurements/src/tenko.rs"

# 電子車検証の番号の検査と車検期限の照合
[[files]]
path = "crates/measurements/src/carins.rs"

# アルコール検知メール (旧値からの判定・宛先の引き・グループ無し / メンバー 0 / 使えない宛先・送信の失敗・送り手無し・引きの失敗)
[[files]]
path = "crates/measurements/src/alert.rs"

# 点呼の確定を後回しにした測定の確定 (確定の口の 200・409・404・400・記録の失敗で入力を残す・見回りの件数と失敗)
[[files]]
path = "crates/measurements/src/deferred.rs"

# 血圧の本人への LINE WORKS (初回だけの判定・dev は送らない・宛先の解決・基準外の一行・送信の失敗・引きの失敗)
[[files]]
path = "crates/measurements/src/bp.rs"

# 毎朝 7:00 の血圧の日報 (日本時間の前日の境・基準外を先頭・記録なし・宛先なし・送信の失敗・テナントごとの失敗)
[[files]]
path = "crates/measurements/src/report.rs"

# 血圧の通知の設定の 4 口 (admin だけ・upsert の来ていない欄と null・一意違反の 409・氏名での結び付けの判定と確定の 1 transaction・メンバー一覧の失敗)
[[files]]
path = "crates/measurements/src/bp_settings.rs"

# upload の 3 口 (R2 はモック。binding 無し・multipart・uuid・R2 の失敗)
[[files]]
path = "crates/measurements/src/upload.rs"
